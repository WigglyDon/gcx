[package]
name = "ntx"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
native-engine = []

[[bin]]
name = "ntx-probe"
path = "src/main.rs"
required-features = ["native-engine"]

[[bin]]
name = "ntx-checkpoint-probe"
path = "src/bin/ntx-checkpoint-probe.rs"
required-features = ["native-engine"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[target.'cfg(target_arch = "aarch64")'.dependencies]
# This pinned sha2 release otherwise selects its software SHA256 backend on
# ARM64. Its asm feature uses runtime HWCAP detection with a software fallback.
sha2 = { version = "=0.10.9", features = ["asm"] }

[build-dependencies]
sha2 = "=0.10.9"
