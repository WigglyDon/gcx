[package]
name = "gcx"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
native-engine = []

[[bin]]
name = "gcx-probe"
path = "src/main.rs"
required-features = ["native-engine"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }

[dev-dependencies]
serde_json = "=1.0.151"
