[package]
name = "gcx"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
native-engine = []

[[bin]]
name = "gcx-probe"
path = "src/main.rs"
required-features = ["native-engine"]

[[bin]]
name = "gcx-checkpoint-probe"
path = "src/bin/gcx-checkpoint-probe.rs"
required-features = ["native-engine"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[build-dependencies]
sha2 = "=0.10.9"
